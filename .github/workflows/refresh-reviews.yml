name: Weekly review refresh

# Once a week, pull the latest rating, review count and top reviews from the
# Google Places API into src/data/reviews.json and commit the result. The push
# to main triggers a normal Netlify deploy, so every page of that deploy shows
# the same numbers and the change is visible in git history.
#
# The site build itself never calls the API (see src/lib/reviews.ts), so this
# workflow is the only thing that updates reviews. It needs two repo secrets,
# the same values Netlify used to have as env vars:
#   GOOGLE_PLACES_API_KEY  — Places API key from Google Cloud
#   GOOGLE_PLACE_ID        — Place ID for Bonet Plumbing
# (Settings → Secrets and variables → Actions → New repository secret.)

on:
  schedule:
    # Mondays at 13:00 UTC (≈9am ET).
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PLACE: ${{ secrets.GOOGLE_PLACE_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PLACE" ]; then
            echo "::error::GOOGLE_PLACES_API_KEY and GOOGLE_PLACE_ID repo secrets must be set"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch reviews from Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: npm run reviews:refresh

      - name: Commit if changed
        run: |
          # The refresh script always bumps fetchedAt; only commit when the
          # rating, count, or reviews themselves changed.
          CHANGED=$(node -e "
            const strip = (o) => { const { fetchedAt, ...rest } = o; return JSON.stringify(rest); };
            const cur = require('./src/data/reviews.json');
            const prev = JSON.parse(require('child_process').execSync('git show HEAD:src/data/reviews.json', { encoding: 'utf8' }));
            console.log(strip(cur) !== strip(prev) ? 'yes' : 'no');
          ")
          if [ "$CHANGED" = "no" ]; then
            git checkout -- src/data/reviews.json
            echo "No review changes this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/reviews.json
          COUNT=$(node -p "require('./src/data/reviews.json').reviewCount")
          RATING=$(node -p "require('./src/data/reviews.json').overallRating")
          git commit -m "Refresh Google reviews (${COUNT} reviews, ${RATING} stars)"
          git push
