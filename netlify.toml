# --- Trailing-slash canonicalization ---
# Handled by Netlify's "Pretty URLs" (/slug → /slug/ when /slug/index.html
# exists). Do NOT add a "/:slug" → "/:slug/" rule here: Netlify ignores the
# trailing slash when matching, so for any URL without a real page the rule
# matches /slug/ too and redirects it to itself (ERR_TOO_MANY_REDIRECTS).

# Spanish 404 for anything unknown under /es/. Netlify skips a redirect when a
# real file matches, so existing pages win.
[[redirects]]
  from = "/es/*"
  to = "/es/404/index.html"
  status = 404
