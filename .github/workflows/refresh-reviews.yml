name: Weekly review refresh

# Triggers a Netlify rebuild once a week so the site picks up new Google reviews.
# Add a repo secret named NETLIFY_BUILD_HOOK whose value is the build hook URL
# from Netlify (Site settings → Build & deploy → Build hooks).

on:
  schedule:
    # Mondays at 13:00 UTC (≈9am ET).
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set"
            exit 1
          fi
          curl -fsSL -X POST -d '{}' "$HOOK"
          echo "Build hook triggered."
