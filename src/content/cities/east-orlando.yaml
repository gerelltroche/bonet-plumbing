  intro: "From Waterford Lakes to Avalon Park and the University corridor, we take on the big jobs: whole-home repiping, water heater and tankless replacement, slab leaks, and sewer lines. A licensed plumber at your East Orlando home today, with the price agreed before we start."
  localIssues:
    - East Orlando is really two plumbing worlds. Avalon Park and Waterford Lakes went up in the late 1990s and 2000s, and those homes are now hitting the age where the original water heaters give out — which is exactly when a tankless conversion starts to make sense. Older Union Park neighborhoods date to the 1960s and 70s, and there we're still dealing with galvanized supply lines that choke down your pressure and cast iron drains that have corroded from the inside out.
    - Slab-on-grade construction runs throughout this part of town, so slab leaks are common no matter the neighborhood — and we find them before they wreck your foundation. In the older pockets, those cast iron sewer lines crack and corrode, then the oak and pine roots find the cracks and make it worse. Out along the UCF corridor there are a lot of rentals, and owners count on us for fast, permitted work that passes inspection the first time.
