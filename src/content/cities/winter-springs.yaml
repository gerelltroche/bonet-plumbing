    - La mayor parte de la ciudad está construida sobre losa, así que cuando el cobre bajo la losa por fin se corroe, encontramos fugas bajo la losa, que casi siempre se delatan por un punto tibio en el piso o una factura de agua que no deja de subir. El follaje de árboles maduros de aquí es hermoso, pero a esas raíces les encanta encontrar una línea de cloaca, y destapamos y reemplazamos muchísimas. Y como el agua dura dFlorida Central acorta la vida de todo calentador de agua, las conversiones a sistema sin tanque y las limpiezas de rutina son dos de las llamadas más comunes que atendemos.
