# --- Trailing-slash canonicalization ---
# Astro is configured with trailingSlash: 'always' and every canonical tag uses
# the /slug/ form. Netlify's "Pretty URLs" already 301s /slug → /slug/, but that
# is a dashboard toggle; this rule pins the behavior in the repo. It never
# shadows real files (robots.txt, favicons) because Netlify skips redirects
# when a matching file exists. Keep it LAST so the specific rules above win.
[[redirects]]
  from = "/:slug"
  to = "/:slug/"
  status = 301
